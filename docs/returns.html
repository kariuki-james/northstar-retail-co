<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns - Northstar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </div>
        <h1>Start a Return / Refund</h1>
        <p>Enter your order ID. If eligible, we will automatically generate a return label.</p>
        
        <form id="returnForm">
            <div class="form-group">
                <label for="returnOrderId">Order ID (Try: ORD-456 or ORD-789)</label>
                <input type="text" id="returnOrderId" required placeholder="e.g. ORD-456">
            </div>
            <button type="submit">Check Eligibility & Return</button>
        </form>

        <div id="result"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
