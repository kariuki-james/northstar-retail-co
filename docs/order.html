<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Status - Northstar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="nav-links">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
      </div>
      <h1>Where is my order?</h1>
      <p>Enter your order ID to see its current shipping status instantly.</p>

      <form id="orderForm">
        <div class="form-group">
          <label for="orderId">Order ID (Try: ORD-123)</label>
          <input type="text" id="orderId" required placeholder="e.g. ORD-123" />
        </div>
        <button type="submit">Check Status</button>
      </form>

      <div id="result"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
